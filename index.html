<title>GymBro</title>
<script>
  // Les liens de partage de GymBro ont déménagé sur getgymbro.web.app (Firebase Hosting).

  location.replace("https://getgymbro.web.app/" + (d ? "p/" + encodeURIComponent(d) : ""));
</script>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Exercio</title>
<script>
  // Les liens de partage d'Exercio (anciennement GymBro) vivent sur exercio.web.app (Firebase
  // Hosting). Un ancien lien, https://otiston.github.io/?d=<identifiant>, mène au même programme
  // là-bas.
  var d = new URLSearchParams(location.search).get("d");
  location.replace("https://exercio.web.app/" + (d ? "p/" + encodeURIComponent(d) : ""));
</script>
<meta http-equiv="refresh" content="0; url=https://exercio.web.app/">
</head>
<body></body>
</html>
